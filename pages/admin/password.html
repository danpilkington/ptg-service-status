<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set your password | PTG Status</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin/style.css"><script src="/admin/password.js" defer></script></head>
<body class="admin-page modern-admin"><main class="wrap" style="margin-top:40px;max-width:560px">
<section class="panel"><h1 style="font-size:28px">Set your password</h1><p>Choose a password of 12–256 characters.</p>
<p id="password-feedback" role="status" aria-live="polite"></p>
<form id="password-complete"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
<label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
<div class="actions" style="margin-top:16px"><button type="submit">Save password</button></div></form>
<p style="margin-top:20px"><a href="/admin/">Return to sign in or request a new link</a></p></section></main></body></html>
